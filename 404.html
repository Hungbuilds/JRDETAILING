<style>
  :root{
    --blue:#0000FF; --blue-deep:#00008C; --blue-bright:#3355FF;
    --black:#050608; --ink:#0A0A0C; --ink-soft:#4A4C55; --silver:#C0C0C0;
    --display:'Anton', sans-serif; --body:'Manrope', sans-serif; --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--body); color:#fff; background:var(--black);
    display:flex; align-items:center; justify-content:center; text-align:center;
    padding:24px;
  }
  .wrap{max-width:520px;}
  .logo-sq{width:64px; height:64px; border-radius:10px; overflow:hidden; margin:0 auto 32px;}
  .logo-sq img{width:100%; height:100%; object-fit:cover; display:block;}
  .code{font-family:var(--mono); font-size:13px; letter-spacing:.2em; color:var(--blue-bright); font-weight:700; margin-bottom:14px;}
  h1{font-family:var(--display); font-weight:400; text-transform:uppercase; font-style:italic; font-size:clamp(34px,7vw,58px); line-height:1; margin-bottom:20px;}
  p{color:var(--silver); font-size:16px; margin-bottom:34px; line-height:1.6;}
  .actions{display:flex; gap:14px; justify-content:center; flex-wrap:wrap;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:15px 30px;
    font-family:var(--mono); font-weight:700; font-size:13px; letter-spacing:.08em; text-transform:uppercase;
    border-radius:2px; text-decoration:none;
  }
  .btn-primary{background:var(--blue); color:#fff;}
  .btn-primary:hover{background:var(--blue-bright);}
  .btn-outline{background:transparent; color:#fff; border:1px solid rgba(255,255,255,.4);}
  .btn-outline:hover{background:rgba(255,255,255,.1);}
</style>
</head>
